# =============================================================================
# Cloud Backend — prod 环境（生产）
# 所有配置必须通过环境变量注入，无默认值，auto-create-bucket 关闭
# =============================================================================
spring:
  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 520MB

  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 3000

server:
  tomcat:
    threads:
      max: 50
      min-spare: 5
    max-connections: 100
    accept-count: 100
    connection-timeout: 10000

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}
  bucket: ${MINIO_BUCKET:cloud-storage}
  auto-create-bucket: false               # 生产环境关闭自动创建桶
  public-url: ${MINIO_PUBLIC_URL}

jwt:
  secret: ${JWT_SECRET}                   # 生产环境必须设置强密钥！
  expiration: 86400000
  header: Authorization
  prefix: Bearer
  issuer: cloud

# 配额默认值（t_setting 配置缺失时兜底，与 local 保持一致）
quota:
  default-user: 5368709120        # 5GB，普通用户基础配额
  default-vip: 107374182400       # 100GB，VIP 用户基础配额

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
  database: 0
  password: ${REDIS_PASSWORD:}
  timeout: 3000

file:
  storage-path: ${FILE_STORAGE_PATH}
  chunk-size: 10485760
  max-size: 536870912
  max-size-user: 536870912            # 512MB，普通用户单文件大小上限
  max-size-vip: 2147483648            # 2GB，VIP 用户单文件大小上限
  max-concurrent-user: 3              # 普通用户并发上传任务数上限
  max-concurrent-vip: 5               # VIP 用户并发上传任务数上限
  small-file-threshold: 10485760       # 10MB，小于此阈值不分片直接上传
  upload-expire-hours: 24             # 上传临时分片/元数据保留时长
  package-expire-hours: 24            # 打包下载产物保留时长
  recycle-days: 30                    # 回收站保留天数，到期物理清理
  preview-text-max-size: 1048576      # 文本预览最大字节数（1MB）

mail:
  host: ${MAIL_HOST}
  port: ${MAIL_PORT}
  username: ${MAIL_USERNAME}
  password: ${MAIL_PASSWORD}
  from: ${MAIL_FROM}