spring:
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}
  bucket: ${MINIO_BUCKET:cloud-storage}
  auto-create-bucket: false
  public-url: ${MINIO_PUBLIC_URL}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  header: Authorization
  prefix: Bearer
  issuer: cloud

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
  database: 0
  password: ${REDIS_PASSWORD:}
  timeout: 3000

file:
  storage-path: ${FILE_STORAGE_PATH}
  chunk-size: 10485760
  max-size: 536870912