# =============================================================================
# Cloud Backend — prod 环境（生产）
# 所有配置必须通过环境变量注入，无默认值，auto-create-bucket 关闭
# =============================================================================
spring:
  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 520MB

  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}
  bucket: ${MINIO_BUCKET:cloud-storage}
  auto-create-bucket: false               # 生产环境关闭自动创建桶
  public-url: ${MINIO_PUBLIC_URL}

jwt:
  secret: ${JWT_SECRET}                   # 生产环境必须设置强密钥！
  expiration: 86400000
  header: Authorization
  prefix: Bearer
  issuer: cloud

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
  database: 0
  password: ${REDIS_PASSWORD:}
  timeout: 3000

file:
  storage-path: ${FILE_STORAGE_PATH}
  chunk-size: 10485760
  max-size: 536870912

mail:
  host: ${MAIL_HOST}
  port: ${MAIL_PORT}
  username: ${MAIL_USERNAME}
  password: ${MAIL_PASSWORD}