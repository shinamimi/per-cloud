spring:

  application:
    name: cloud-backend

  profiles:
    active: local

  lifecycle:
    timeout-per-shutdown-phase: 30s

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.cloud.backend.domain

  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    default-fetch-size: 100
    default-statement-timeout: 30