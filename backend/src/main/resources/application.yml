spring:

  application:
    name: cloud-backend

  profiles:
    active: local

  lifecycle:
    timeout-per-shutdown-phase: 30s

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.cloud.backend.entity

  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    default-fetch-size: 100
    default-statement-timeout: 30

logging:
  config: classpath:logback-spring.xml

super-admin:
  username: ${SUPER_ADMIN_USERNAME:root}
  password: ${SUPER_ADMIN_PASSWORD:root123456}
  email: ${SUPER_ADMIN_EMAIL:root@cloud.local}