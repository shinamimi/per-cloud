spring:

  datasource:

    url: jdbc:mysql://localhost:${MYSQL_PORT:3306}/${MYSQL_DATABASE:cloud}?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai

    username: ${MYSQL_USER:cloud}

    password: ${MYSQL_PASSWORD:mimi}

    driver-class-name: com.mysql.cj.jdbc.Driver

  data:

    redis:

      host: localhost

      port: ${REDIS_PORT:6379}

      password: ${REDIS_PASSWORD:}

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minio123456
  bucket: cloud-storage
  auto-create-bucket: true
  public-url: http://localhost:9000

jwt:
  secret: my-secret-key-change-in-production
  expiration: 86400000
  header: Authorization
  prefix: Bearer
  issuer: cloud

redis:
  host: localhost
  port: 6379
  database: 0
  password:
  timeout: 3000

file:
  storage-path: /tmp/cloud-storage
  chunk-size: 10485760
  max-size: 536870912