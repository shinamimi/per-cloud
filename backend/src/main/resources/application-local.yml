# =============================================================================
# Cloud Backend — local 环境（本地开发）
# 本地运行 Docker 容器中的 MySQL / Redis / MinIO
# 敏感配置可被环境变量覆盖，有默认兜底
# =============================================================================
spring:

  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3306}/${MYSQL_DATABASE:cloud}?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:cloud}
    password: ${MYSQL_PASSWORD:mimi}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:placeholder@local.dev}
    password: ${SMTP_PASSWORD:placeholder}
    from: ${SMTP_FROM:noreply@local.dev}
    properties:
      mail:
        smtp:
          starttls:
            enable: true
            required: true

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minio123456
  bucket: cloud-storage
  auto-create-bucket: true        # 本地开发自动创建桶
  public-url: http://localhost:9000

jwt:
  secret: kF5Wih0b8zNo4/UsEFR5yN8y5OfsHArdLr6xCSKfKTo=   # 开发用弱密钥，生产务必通过环境变量覆盖
  expiration: 86400000                         # 24小时，毫秒
  header: Authorization
  prefix: Bearer
  issuer: cloud

redis:
  host: localhost
  port: 6379
  database: 0
  password:
  timeout: 3000

quota:
  default-user: 5368709120        # 5GB，普通用户基础配额
  default-vip: 107374182400       # 100GB，VIP 用户基础配额（预留）

file:
  storage-path: /tmp/cloud-storage
  chunk-size: 10485760     # 10MB，分片上传的片段大小
  max-size: 536870912      # 512MB，单文件大小上限