# =============================================================================
# Cloud Backend — dev 环境（集成测试 / Docker Compose）
# 服务通过 docker-compose 的容器名访问（mysql / redis / minio）
# 部分配置无默认值（如 SMTP_USERNAME），需要 .env 提供
# =============================================================================
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:cloud}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${SMTP_HOST:smtp-relay.brevo.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    from: ${SMTP_FROM}
    properties:
      mail:
        smtp:
          starttls:
            enable: true      #连接 SMTP 后，请求服务器升级为 TLS 加密（587 端口默认明文，通过 STARTTLS 握手升级）
            required: true    #强制要求 STARTTLS，如果服务器不支持就拒绝连接

minio:
  endpoint: http://${MINIO_HOST:minio}:${MINIO_API_PORT:9000}
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:minio123456}
  bucket: cloud-storage
  auto-create-bucket: true
  public-url: http://${MINIO_HOST:minio}:${MINIO_API_PORT:9000}

jwt:
  secret: ${JWT_SECRET:kF5Wih0b8zNo4/UsEFR5yN8y5OfsHArdLr6xCSKfKTo=}
  expiration: 86400000
  header: Authorization
  prefix: Bearer
  issuer: cloud

redis:
  host: ${REDIS_HOST:redis}
  port: ${REDIS_PORT:6379}
  database: 0
  password: ${REDIS_PASSWORD:}
  timeout: 3000

file:
  storage-path: /tmp/cloud-storage
  chunk-size: 10485760
  max-size: 536870912