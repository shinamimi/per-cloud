# Cloud 云盘 — Docker Compose 开发环境
# MySQL 8.4 + Redis 7.2 + MinIO
services:
  mysql:
    image: mysql:8.4
    container_name: cloud-mysql
    restart: unless-stopped
    env_file:
      - ./docker/.env
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cloud-network

  redis:
    image: redis:7.2
    container_name: cloud-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]  # 开启 AOF 持久化
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cloud-network

  minio:
    image: minio/minio
    container_name: cloud-minio
    restart: unless-stopped
    env_file:
      - ./docker/.env
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"  # API 端口
      - "9001:9001"  # 管理控制台端口
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cloud-network

volumes:
  mysql-data:
  redis-data:
  minio-data:

networks:
  cloud-network:
    driver: bridge