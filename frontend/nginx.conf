# =============================================================================
# Cloud 云盘 — 前端生产 Nginx 配置（含安全加固）
# 同域部署：80 端口托管静态 + 反代 /api 与 /ws/progress 到后端容器
#
# 安全设计（防 DoS / 爬虫 / 滥用）：
# 1. limit_req 按 IP 限流：API 普通 20r/s、登录/验证码 2r/s、上传分片 5r/s、WS 建连 2r/s
# 2. client_max_body_size 520M 对齐后端 multipart（分片上传 10M/块，留余量）
# 3. 各类超时兜底：proxy_connect/read/send + keepalive，防慢速连接拖住后端
# 4. 隐藏版本号 server_tokens off + 安全响应头（X-Frame/CSP/HSTS）
# 5. 静态资源强缓存（带 hash 的 assets）+ gzip 压缩
# 6. 爬虫基础防护：robots.txt + 常见采集 UA 拦截（User-Agent 匹配返回 403）
# =============================================================================
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=static_limit:10m rate=50r/s;

server {
    listen 80;

    server_tokens off;                       # 隐藏 Nginx 版本号
    keepalive_timeout 30;
    client_body_timeout 60;                  # 读 body 超时，防慢 POST 拖连接
    client_header_timeout 60;
    send_timeout 30;                         # 发送超时，防慢读取卡 worker
    client_max_body_size 520m;               # 对齐后端 multipart（分片上传 10M/块）

    root /usr/share/nginx/html;
    index index.html;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: http://101.35.233.30:9000; connect-src 'self' ws://101.35.233.30:80 http://101.35.233.30:9000; style-src 'self' 'unsafe-inline'; script-src 'self'" always;

    # ---------- 爬虫基础拦截（明确采集类 UA 返回 403；不拦 curl 等运维工具） ----------
    if ($http_user_agent ~* "(AhrefsBot|SemrushBot|MJ12bot|Baiduspider|Bytespider|YisouSpider|scrapy|python-requests|facebookexternalhit|YandexBot|Sogou web spider)") {
        return 403;
    }

    # SPA 路由回退
    location / {
        limit_req zone=static_limit burst=100 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # robots.txt：禁止搜索引擎收录（个人云盘）
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # 静态资源（vite 产物带 hash，可强缓存一年）
    location /assets/ {
        limit_req zone=static_limit burst=200 nodelay;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- 认证类接口（严格限流：防爆破/验证码轰炸） ----------
    location ~ ^/api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---------- 上传类接口（分片上传，放宽 QPS 但限 body） ----------
    location ~ ^/api/files/upload/ {
        limit_req zone=upload_limit burst=10 nodelay;
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;             # 大分片传输需长超时
        proxy_send_timeout 600s;
    }

    # ---------- 普通 API（通用限流） ----------
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---------- WebSocket 进度推送 ----------
    location /ws/ {
        limit_req zone=ws_limit burst=3 nodelay;
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # gzip 压缩（文本类资源）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_vary on;
}